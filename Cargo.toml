[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Mark Cockerill"]
repository = "https://github.com/MarkCockerill12/3dModelPoser"

[workspace.dependencies]
poser-core = { path = "crates/poser-core" }
poser-io = { path = "crates/poser-io" }
poser-rig = { path = "crates/poser-rig" }
poser-render = { path = "crates/poser-render" }
poser-ai = { path = "crates/poser-ai" }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
gltf = { version = "1.4", features = ["extras", "names", "KHR_materials_emissive_strength", "KHR_texture_transform", "import"] }
ufbx = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
rfd = "0.18"
faer = "0.24"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
